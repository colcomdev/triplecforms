<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple C Pigs - Field Staff Portal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#03200e',
                        },
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow-emerald': '0 0 35px -5px rgba(34, 197, 94, 0.45)',
                        'glow-gold': '0 0 25px -3px rgba(245, 158, 11, 0.35)',
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(3, 32, 14, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(34, 197, 94, 0.8); }

        .glass-card {
            background: rgba(3, 32, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-nav {
            background: rgba(3, 32, 14, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.03); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-emerald-950 text-emerald-50 font-sans min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-emerald-950 overflow-x-hidden">

    <!-- Background Ambient Glow Effects -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/20 rounded-full blur-[120px] animate-pulse-glow"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-emerald-400/15 rounded-full blur-[140px] animate-pulse-glow" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-amber-500/10 rounded-full blur-[130px]"></div>
    </div>

    <!-- Header Navigation -->
    <header class="relative z-30 w-full border-b border-emerald-800/50 glass-nav transition-colors duration-300">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToSearch()">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-800 via-emerald-600 to-amber-400 p-0.5 shadow-glow-emerald flex items-center justify-center">
                    <div class="w-full h-full bg-emerald-950 rounded-[14px] flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-piggy-bank text-lg"></i>
                    </div>
                </div>
                <div>
                    <span class="text-base sm:text-lg font-black tracking-wider uppercase bg-gradient-to-r from-emerald-200 via-emerald-100 to-amber-300 bg-clip-text text-transparent">
                        TRIPLE C PIGS
                    </span>
                    <span class="block text-[9px] font-bold tracking-widest text-emerald-400 uppercase -mt-1">
                        Field Staff Portal
                    </span>
                </div>
            </div>

            <!-- Top Status Indicator -->
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-900/60 border border-emerald-800 text-xs text-emerald-300 font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="hidden sm:inline">System Ready</span>
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col justify-center items-center">

        <!-- SEARCH / SELECTION SCREEN -->
        <section id="selectionSection" class="w-full max-w-2xl mx-auto space-y-8 my-auto transition-all duration-300">
            
            <!-- Hero Title -->
            <div class="text-center space-y-3">
                <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-900/80 border border-emerald-700/60 text-[11px] font-semibold text-emerald-300 uppercase tracking-widest shadow-sm">
                    <i class="fa-solid fa-bolt text-amber-400 text-xs"></i>
                    <span>Quick Field Entry</span>
                </div>
                <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white">
                    Select Form
                </h1>
                <p class="text-emerald-300/80 text-xs sm:text-sm max-w-md mx-auto">
                    Type to search or select a category filter below to launch Microsoft Forms.
                </p>
            </div>

            <!-- Main Interactive Card -->
            <div class="glass-card rounded-3xl p-6 sm:p-8 border border-emerald-700/50 shadow-2xl space-y-6 relative">
                
                <!-- Searchable Combobox Container -->
                <div class="relative" id="comboboxWrapper">
                    <label class="block text-xs font-bold text-emerald-300 uppercase tracking-wider mb-2 flex items-center justify-between">
                        <span>Search Operational Form</span>
                        <span class="text-[10px] text-emerald-400/70 font-normal">Use &uparrow;&downarrow; to navigate</span>
                    </label>

                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-emerald-400">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </div>
                        <input type="text" 
                            id="comboboxInput" 
                            placeholder="Type form title (e.g. Visitors, A.I, Farrowing, Vet)..." 
                            autocomplete="off"
                            onfocus="openCombobox()"
                            oninput="filterCombobox()"
                            onkeydown="handleKeydown(event)"
                            class="w-full pl-11 pr-12 py-3.5 bg-emerald-900/90 border-2 border-emerald-700/80 rounded-2xl text-sm font-semibold text-white placeholder-emerald-400/60 focus:outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/20 transition-all shadow-inner">
                        
                        <button type="button" onclick="toggleCombobox()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-emerald-400 hover:text-white">
                            <i class="fa-solid fa-chevron-down text-xs transition-transform duration-200" id="comboboxChevron"></i>
                        </button>
                    </div>

                    <!-- Dropdown List -->
                    <div id="comboboxMenu" class="hidden absolute top-full left-0 right-0 mt-2 bg-emerald-900/95 border border-emerald-700 rounded-2xl shadow-2xl overflow-hidden z-50 max-h-64 overflow-y-auto backdrop-blur-xl divide-y divide-emerald-800/60">
                        <div id="comboboxList" class="py-1">
                            <!-- Dynamic items injected here -->
                        </div>
                    </div>
                </div>

                <!-- Category Chips / Filters -->
                <div class="space-y-2">
                    <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider block">
                        Category Filters
                    </span>
                    <div id="categoryChips" class="flex flex-wrap gap-2">
                        <!-- Dynamic category chips injected here -->
                    </div>
                </div>

                <!-- Action CTA Button -->
                <div class="pt-2">
                    <button id="openFormBtn" onclick="openSelectedForm()" disabled class="w-full py-4 bg-gradient-to-r from-emerald-500 via-emerald-400 to-amber-400 text-emerald-950 font-black text-sm uppercase tracking-wider rounded-2xl shadow-glow-emerald hover:brightness-110 active:scale-[0.99] transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center space-x-2">
                        <span>Fill Selected Form</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>

            </div>

        </section>

        <!-- EMBEDDED FORM VIEWER SECTION -->
        <section id="viewerSection" class="hidden w-full max-w-4xl mx-auto space-y-4 my-auto transition-all duration-300">
            
            <!-- Top Control Bar -->
            <div class="flex flex-wrap items-center justify-between gap-3 glass-card p-4 rounded-2xl border border-emerald-800/80 shadow-lg">
                <div class="flex items-center space-x-3">
                    <button onclick="resetToSearch()" class="px-4 py-2 bg-emerald-900/80 hover:bg-emerald-800 text-emerald-200 text-xs font-bold rounded-xl border border-emerald-700 transition-all flex items-center space-x-2 group">
                        <i class="fa-solid fa-arrow-left group-hover:-translate-x-0.5 transition-transform"></i>
                        <span>Back to Search</span>
                    </button>
                    <span class="text-emerald-700">|</span>
                    <h2 id="activeFormTitle" class="text-sm sm:text-base font-extrabold text-white truncate max-w-[200px] sm:max-w-md">
                        Form Title
                    </h2>
                </div>

                <div class="flex items-center space-x-2">
                    <a id="directLinkBtn" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 text-xs font-bold rounded-xl transition-all flex items-center space-x-1.5">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                        <span class="hidden sm:inline">Direct Link</span>
                    </a>
                </div>
            </div>

            <!-- Embedded Form Frame Container -->
            <div class="relative bg-white rounded-3xl border border-emerald-800/80 shadow-2xl overflow-hidden min-h-[650px] flex flex-col">
                <!-- Loader Overlay -->
                <div id="iframeLoader" class="absolute inset-0 z-10 bg-emerald-950 flex flex-col items-center justify-center gap-3 transition-opacity duration-300">
                    <div class="w-10 h-10 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs font-bold text-emerald-300 tracking-wider">Loading Triple C Microsoft Form...</span>
                </div>

                <!-- Microsoft Form Frame -->
                <iframe id="msFormIframe" 
                    class="w-full flex-1 border-0 min-h-[650px]"
                    src=""
                    allowfullscreen
                    onload="hideLoader()">
                </iframe>
            </div>

        </section>

    </main>

    <footer class="relative z-10 border-t border-emerald-900/80 bg-emerald-950/80 py-4 text-center">
        <p class="text-[11px] font-semibold text-emerald-500">
            © 2026 Triple C Pigs• Powered by Microsoft Forms
        </p>
    </footer>

    <script>
        // Specific Categories requested
        const CATEGORIES = [
            'All',
            'Visitors',
            'A.I Section',
            'Breeding & Farrowing',
            'Feed & Inventory',
            'Health & Vet',
            'General Logs'
        ];

        // Triple C Pigs Forms mapped to updated categories
        const FORMS_DATA = [
            {
                id: 'visitor-entry-log',
                title: 'Biosecurity Visitor & Vehicle Log',
                category: 'Visitors',
                embedUrl: 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=no-Bw6C_ZU2L1F-GwwuhATS-w7GI8NdInHruPfau0ZdUMUFMVFU2RllaWTQ4MUg4Sk1DQVpCNkJNRC4u&embed=true',
                directUrl: 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=no-Bw6C_ZU2L1F-GwwuhATS-w7GI8NdInHruPfau0ZdUMUFMVFU2RllaWTQ4MUg4Sk1DQVpCNkJNRC4u&embed=true',
                icon: 'fa-id-card-clip'
            },
            {
                id: 'ai-semen-dose-log',
                title: 'A.I Semen Batch & Insemination Log',
                category: 'A.I Section',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u',
                icon: 'fa-dna'
            },
            {
                id: 'boar-semen-collection',
                title: 'Boar Semen Collection & Lab Analysis',
                category: 'A.I Section',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u',
                icon: 'fa-vial'
            },
            {
                id: 'farrowing-log',
                title: 'Farrowing & Sow Litter Entry Log',
                category: 'Breeding & Farrowing',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u',
                icon: 'fa-baby-carriage'
            },
            {
                id: 'sow-pregnancy-check',
                title: 'Sow Pregnancy Check & Ultrasound',
                category: 'Breeding & Farrowing',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMFBIT0s1VkNZRUtJUk85RjlVTE0xVEtFTS4u',
                icon: 'fa-stethoscope'
            },
            {
                id: 'feed-consumption',
                title: 'Daily Feed & Water Consumption',
                category: 'Feed & Inventory',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUM1ExVzlGNjFWVUVSNzNZNFoyNzI5SzgyVi4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUM1ExVzlGNjFWVUVSNzNZNFoyNzI5SzgyVi4u',
                icon: 'fa-wheat-awn'
            },
            {
                id: 'feed-silo-stock',
                title: 'Silo Grain Delivery & Feed Stock Record',
                category: 'Feed & Inventory',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUM1ExVzlGNjFWVUVSNzNZNFoyNzI5SzgyVi4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUM1ExVzlGNjFWVUVSNzNZNFoyNzI5SzgyVi4u',
                icon: 'fa-boxes-packing'
            },
            {
                id: 'swine-health',
                title: 'Swine Health & Vet Treatment Sheet',
                category: 'Health & Vet',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUOTQzSjVHRFhTTURUSjNWMUpGVVhCVjdZRy4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUOTQzSjVHRFhTTURUSjNWMUpGVVhCVjdZRy4u',
                icon: 'fa-user-nurse'
            },
            {
                id: 'daily-mortality',
                title: 'Mortality & Pen Removal Log',
                category: 'Health & Vet',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUOTQzSjVHRFhTTURUSjNWMUpGVVhCVjdZRy4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUOTQzSjVHRFhTTURUSjNWMUpGVVhCVjdZRy4u',
                icon: 'fa-notes-medical'
            },
            {
                id: 'daily-shift-log',
                title: 'General Shift Summary & Incident Form',
                category: 'General Logs',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMDczUk5NVEVPTFFOS1lXQUdUS1RaNzE4My4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMDczUk5NVEVPTFFOS1lXQUdUS1RaNzE4My4u',
                icon: 'fa-clipboard-list'
            },
            {
                id: 'maintenance-request',
                title: 'Pen & Equipment Maintenance Request',
                category: 'General Logs',
                embedUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMDczUk5NVEVPTFFOS1lXQUdUS1RaNzE4My4u&embed=true',
                directUrl: 'https://forms.office.com/Pages/ResponsePage.aspx?id=DQSIOKtoW0WcfC1S4QACeQAAAAAAAAAAAAN__xUQG3VUMDczUk5NVEVPTFFOS1lXQUdUS1RaNzE4My4u',
                icon: 'fa-wrench'
            }
        ];

        // Global State
        let selectedForm = null;
        let selectedCategory = 'All';
        let highlightedIndex = -1;

        // Initialization
        window.onload = function() {
            renderCategoryChips();
            filterCombobox();

            // Outside click handler to close combobox dropdown
            document.addEventListener('click', function(e) {
                const wrapper = document.getElementById('comboboxWrapper');
                if (wrapper && !wrapper.contains(e.target)) {
                    closeCombobox();
                }
            });
        };

        function renderCategoryChips() {
            const container = document.getElementById('categoryChips');

            container.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat === selectedCategory;
                const activeClass = isActive 
                    ? 'bg-emerald-400 text-emerald-950 font-extrabold shadow-glow-emerald border-emerald-300' 
                    : 'bg-emerald-900/60 hover:bg-emerald-800 text-emerald-300 font-semibold border-emerald-700/60';
                
                return `
                    <button onclick="selectCategory('${cat}')" type="button" class="px-3 py-1.5 rounded-xl text-xs border transition-all ${activeClass}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            renderCategoryChips();
            filterCombobox();
            openCombobox();
        }

        function openCombobox() {
            const menu = document.getElementById('comboboxMenu');
            const chevron = document.getElementById('comboboxChevron');
            menu.classList.remove('hidden');
            chevron.style.transform = 'rotate(180deg)';
        }

        function closeCombobox() {
            const menu = document.getElementById('comboboxMenu');
            const chevron = document.getElementById('comboboxChevron');
            menu.classList.add('hidden');
            chevron.style.transform = 'rotate(0deg)';
            highlightedIndex = -1;
        }

        function toggleCombobox() {
            const menu = document.getElementById('comboboxMenu');
            if (menu.classList.contains('hidden')) {
                openCombobox();
            } else {
                closeCombobox();
            }
        }

        function filterCombobox() {
            const input = document.getElementById('comboboxInput');
            const query = input.value.toLowerCase().trim();
            const list = document.getElementById('comboboxList');

            const filtered = FORMS_DATA.filter(form => {
                const matchesCat = selectedCategory === 'All' || form.category === selectedCategory;
                const matchesQuery = form.title.toLowerCase().includes(query) || form.category.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="px-4 py-3 text-xs text-emerald-400/70 text-center italic">
                        No forms found matching "${query}"
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map((form, idx) => `
                <div onclick="chooseForm('${form.id}')" 
                    id="combo-item-${idx}" 
                    class="px-4 py-3 hover:bg-emerald-800/80 cursor-pointer transition-colors flex items-center justify-between group">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-xl bg-emerald-800 text-amber-400 flex items-center justify-center text-xs shrink-0 border border-emerald-700">
                            <i class="fa-solid ${form.icon}"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white group-hover:text-amber-300 transition-colors">
                                ${form.title}
                            </div>
                            <div class="text-[10px] font-medium text-emerald-400">
                                ${form.category}
                            </div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] text-emerald-500 group-hover:translate-x-0.5 transition-transform"></i>
                </div>
            `).join('');
        }

        function handleKeydown(e) {
            const list = document.getElementById('comboboxList');
            const items = list.querySelectorAll('[id^="combo-item-"]');

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
                updateHighlight(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                highlightedIndex = Math.max(highlightedIndex - 1, 0);
                updateHighlight(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightedIndex >= 0 && items[highlightedIndex]) {
                    items[highlightedIndex].click();
                }
            } else if (e.key === 'Escape') {
                closeCombobox();
            }
        }

        function updateHighlight(items) {
            items.forEach((item, idx) => {
                if (idx === highlightedIndex) {
                    item.classList.add('bg-emerald-800');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('bg-emerald-800');
                }
            });
        }

        function chooseForm(formId) {
            const form = FORMS_DATA.find(f => f.id === formId);
            if (!form) return;

            selectedForm = form;
            document.getElementById('comboboxInput').value = form.title;
            document.getElementById('openFormBtn').disabled = false;
            closeCombobox();
        }

        function openSelectedForm() {
            if (!selectedForm) return;

            document.getElementById('activeFormTitle').innerText = selectedForm.title;
            document.getElementById('directLinkBtn').href = selectedForm.directUrl;

            const loader = document.getElementById('iframeLoader');
            const iframe = document.getElementById('msFormIframe');

            loader.style.opacity = '1';
            loader.classList.remove('hidden');
            iframe.src = selectedForm.embedUrl;

            document.getElementById('selectionSection').classList.add('hidden');
            document.getElementById('viewerSection').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideLoader() {
            const loader = document.getElementById('iframeLoader');
            loader.style.opacity = '0';
            setTimeout(() => { loader.classList.add('hidden'); }, 300);
        }

        function resetToSearch() {
            document.getElementById('viewerSection').classList.add('hidden');
            document.getElementById('selectionSection').classList.remove('hidden');
            document.getElementById('msFormIframe').src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
